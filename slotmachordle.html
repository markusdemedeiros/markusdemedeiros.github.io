<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8">
  <title>Markus de Medeiros</title>
  <link rel="stylesheet" type="text/css" href="stylesheet.css">
  <link rel="shortcut icon" type="image/x-icon" href="favicon.ico">
</head>

<body>
  <center> <h1> Slotmachordle </h1> </center>
  <br>
  <center>
  <div style="width: 80%; margin: 0 auto;">
    <div style="border: 1px dotted; padding: 20px;">
      <div style="display: flex; gap: 10px; justify-content: center;">
        <p id="slot-1" style="color: #aeaeae;"></p>
        <p id="slot-2" style="color: #aeaeae;"></p>
        <p id="slot-3" style="color: #aeaeae;"></p>
        <p id="slot-4" style="color: #aeaeae;"></p>
        <p id="slot-5" style="color: #aeaeae;"></p>
      </div>
      <button onclick="playslots()">Play</button>
    </div>
  </div>
  </center>
  <br>
  <div style="width: 80%; margin: 0 auto; display: none;" id="result-pane">
    <p>Share your results with your friends!</p>
    <div style="font-family: monospace; background-color: #f0f0f0; padding: 3px 10px; margin: 10px">
      <p id="slot-txt"> 🎰 Slotmachordle </p>
      <p id="outcome"> </p>
      <p> https://markusde.ca/slotmachordle.html </p>
    </div>
    <button onclick="copyResult()">Copy</button>
  </div>
</body>

<script>
  const N = 50;
  const interval = 3000 / N;
  let count = 0;

  function mulberry32(seed) {
      return function() {
          seed |= 0;
          seed = seed + 0x6D2B79F5 | 0;
          let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
          t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
          return ((t ^ t >>> 14) >>> 0) / 4294967296;
      };
  }
  const today = new Date();
  const seed = today.getFullYear() * 10000 + (today.getMonth() + 1) * 100 + today.getDate();
  const casinotypes = ["🍒", "💎", "🍀", "🍉", "🍋", "⭐" ];
  const casinoN = casinotypes.length;
  const slotnames = ['slot-1', 'slot-2', 'slot-3', 'slot-4', 'slot-5'];
  let played = false;

  function setCasino(s) {
      for (let i = 0; i < 5; i++) {
          document.getElementById(slotnames[i]).textContent = "[" + s[i] + "]";
      }
      document.getElementById("outcome").textContent = s.join("");
  }

  function setCasinoRand(rng) {
      for (let i = 0; i < 5; i++) {
          let v = Math.floor(rng() * casinoN);
          document.getElementById(slotnames[i]).textContent = "[" + casinotypes[v] + "]";
      }
  }

  const timer = setInterval(() => {
      count++;
      if (count >= N) clearInterval(timer);
  }, interval);

    function playslots() {
    if (!played) {
        played = true;
        let count = 0;
        const timer = setInterval(() => {
            setCasinoRand(mulberry32(Date.now() + 420 * 69 + 666));
            count++;
            if (count >= N) {
                clearInterval(timer);
                let finalRng = mulberry32(seed);
                let result = [];
                for (let i = 0; i < 5; i++) {
                    result.push(casinotypes[Math.floor(finalRng() * casinoN)]);
                }
                setCasino(result);
                document.getElementById("result-pane").style.display = "block";
            }
        }, interval);
    }
}

const date = today.toLocaleDateString("en-US", { month: "short", day: "numeric", year: "numeric" });
const text_top = "🎰 Slotmachordle " + date;

  if (!played) {
      document.getElementById("slot-txt").textContent = text_top;
      setCasino(["❓","❓","❓","❓","❓"]);
  }

  function copyResult() {
    const outcome = document.getElementById("outcome").textContent;
    const text = text_top + "\n" + outcome + "\nhttps://markusde.ca/slotmachordle.html";
    navigator.clipboard.writeText(text);
    const btn = document.getElementById("copyBtn");
    btn.textContent = "Copied!";
    setTimeout(() => btn.textContent = "Copy", 1500);
}

</script>

</html>
